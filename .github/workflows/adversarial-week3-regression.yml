name: AgentForge Week 3 Regression Gate

on:
  pull_request:
    paths:
      - "copilot/api/**"
      - "security/adversarial/**"
      - "security/docs/**"
      - ".github/workflows/adversarial-week3-regression.yml"
      - "THREAT_MODEL.md"
      - "ARCHITECTURE.md"
      - "AI_COST_ANALYSIS.md"
  push:
    branches:
      - main
      - master
    paths:
      - "copilot/api/**"
      - "security/adversarial/**"
      - "security/docs/**"
      - ".github/workflows/adversarial-week3-regression.yml"
      - "THREAT_MODEL.md"
      - "ARCHITECTURE.md"
      - "AI_COST_ANALYSIS.md"

jobs:
  week3-regression:
    name: Week 3 Adversarial Regression Gate
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      DEV_AUTH_BYPASS: "true"
      DEMO_AUTH_BYPASS: "true"
      LLM_PROVIDER: mock
      STRUCTURED_LOGGING_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      VECTOR_SEARCH_ENABLED: "false"
      CONVERSATION_PERSISTENCE_ENABLED: "false"
      AUDIT_PERSISTENCE_REQUIRED: "false"
      ADVERSARIAL_TARGET_MODE: local
      ADVERSARIAL_LOCAL_TARGET_URL: http://127.0.0.1:8001
      ADVERSARIAL_ALLOWED_HOSTS: 127.0.0.1,localhost
      ADVERSARIAL_SQLITE_PATH: ${{ runner.temp }}/week3-runs.sqlite
      ADVERSARIAL_PRIVATE_SQLITE_PATH: ${{ runner.temp }}/week3-private.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            copilot/api/pyproject.toml
            copilot/api/constraints.txt
            security/adversarial/pyproject.toml

      - name: Install Co-Pilot API dependencies
        working-directory: copilot/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Install adversarial platform dependencies
        working-directory: security/adversarial
        run: python -m pip install -e ".[dev]"

      - name: Start local Co-Pilot target
        working-directory: copilot/api
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/copilot-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/copilot-api.pid"
          python - <<'PY'
          import time

          import httpx

          deadline = time.time() + 30
          last_error = "not polled yet"
          while time.time() < deadline:
              try:
                  response = httpx.get("http://127.0.0.1:8001/readyz", timeout=2.0)
                  if response.status_code == 200:
                      print(response.text)
                      break
                  last_error = f"HTTP {response.status_code}: {response.text[:200]}"
              except Exception as exc:
                  last_error = repr(exc)
              time.sleep(1)
          else:
              raise SystemExit(f"Co-Pilot API did not become ready: {last_error}")
          PY

      - name: Lint adversarial platform
        working-directory: security/adversarial
        run: python -m ruff check app tests

      - name: Type check adversarial platform
        working-directory: security/adversarial
        run: python -m mypy app

      - name: Unit test adversarial platform
        working-directory: security/adversarial
        run: python -m pytest

      - name: Judge quality gate
        working-directory: security/adversarial
        run: python -m app.run_judge_eval --enforce

      - name: Regression replay gate with Red Team variants
        working-directory: security/adversarial
        run: python -m app.run_week3_eval --target local --suite regression --enforce --include-variants --skip-tags setup-required

      - name: Upload Week 3 regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week3-regression-artifacts
          path: |
            ${{ runner.temp }}/week3-runs.sqlite
            ${{ runner.temp }}/week3-private.sqlite
            ${{ runner.temp }}/copilot-api.log
